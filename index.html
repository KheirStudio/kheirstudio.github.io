<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kheir Studio — Software studio</title>
<meta name="description" content="Kheir Studio. Turning ideas into next generation web and mobile experiences.">
<meta name="theme-color" content="#0a0a0e">
<meta property="og:title" content="Kheir Studio">
<meta property="og:description" content="Turning ideas into next generation web and mobile experiences.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='none' stroke='%237c8cff' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0e;
  --ink:#f4f4f7;
  --mut:#8b8b99;
  --accent:#7c8cff;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100svh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* soft glow behind the centre */
.aura{
  position:fixed;top:50%;left:50%;width:min(1100px,150vw);height:min(1100px,150vw);
  transform:translate(-50%,-52%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(124,140,255,.16),rgba(124,140,255,.05) 42%,transparent 68%);
  animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{50%{transform:translate(-50%,-52%) scale(1.09);opacity:.85}}

.wrap{max-width:1160px;margin:0 auto;padding:0 28px;width:100%}
.shell{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}

/* ---------- nav ---------- */
nav{padding:26px 0}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.mark{width:15px;height:15px;border:2px solid var(--accent);border-radius:50%;
  animation:pulse 4s var(--ease) infinite}
@keyframes pulse{50%{transform:scale(.72);opacity:.6}}
.nav-links{display:flex;gap:28px;font-size:14px;color:var(--mut)}
.nav-links a{transition:color .3s}
.nav-links a:hover{color:var(--ink)}
@media(max-width:560px){.nav-links{gap:18px;font-size:13px}}

/* ---------- centre ---------- */
main{flex:1;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px 0 70px}
.emblem{
  width:132px;height:132px;margin:0 auto 46px;position:relative;
  opacity:0;animation:fade 1.1s var(--ease) both .1s;
}
.emblem i{
  position:absolute;inset:0;border:1px solid rgba(124,140,255,.5);border-radius:50%;
  animation:ripple 4.5s var(--ease) infinite;
}
.emblem i:nth-child(2){animation-delay:1.5s}
.emblem i:nth-child(3){animation-delay:3s}
@keyframes ripple{
  0%{transform:scale(.55);opacity:0}
  25%{opacity:1}
  100%{transform:scale(1);opacity:0}
}
.emblem b{
  position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
  background:var(--accent);border-radius:50%;
  box-shadow:0 0 44px rgba(124,140,255,.65);
}
.eyebrow{
  font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);
  opacity:0;animation:fade .9s var(--ease) both .3s;
}
h1{
  font-size:clamp(42px,8.5vw,86px);font-weight:600;letter-spacing:-.045em;
  line-height:1.02;margin-top:20px;
  opacity:0;animation:up 1s var(--ease) both .42s;
}
.sub{
  color:var(--mut);font-size:16px;max-width:42ch;margin:22px auto 0;line-height:1.6;
  opacity:0;animation:up 1s var(--ease) both .54s;
}
@keyframes fade{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cta{
  display:inline-flex;align-items:center;gap:12px;margin-top:44px;
  border:1px solid var(--accent);border-radius:999px;padding:14px 30px;
  font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink);opacity:0;animation:up 1s var(--ease) both .66s;
  transition:background .35s var(--ease),box-shadow .35s var(--ease),gap .35s var(--ease);
}
.cta:hover{background:rgba(124,140,255,.12);box-shadow:0 0 34px rgba(124,140,255,.28);gap:18px}
.cta span{font-size:15px;line-height:1}

/* ---------- footer ---------- */
.legal{margin-top:7px;font-size:10px;line-height:1.6;color:#3a3a44}
footer{padding:22px 0 30px;color:#4d4d59;font-size:11px;text-align:center;
  opacity:0;animation:fade 1s var(--ease) both 1s}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .emblem,.eyebrow,h1,.sub,.cta,footer{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>

<div class="shell">

  <nav>
    <div class="wrap nav-in">
      <span class="brand"><i class="mark"></i>Kheir Studio</span>
      <div class="nav-links">
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <div class="emblem" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
      <p class="eyebrow">Software Studio</p>
      <h1>Kheir Studio</h1>
      <p class="sub">
        Turning ideas into next generation web and mobile experiences.
      </p>
      <a class="cta" href="contact.html">Let's talk <span>&rarr;</span></a>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>&copy; <span id="year">2026</span> Kheir Studio Limited</span>
      <p class="legal">Kheir Studio Limited (17341526) &middot; 60 Office, London, England, W1T 2EW</p>
    </div>
  </footer>

</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
