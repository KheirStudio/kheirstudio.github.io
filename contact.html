<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Kheir Studio</title>
<meta name="description" content="Get in touch with Kheir Studio.">
<meta name="theme-color" content="#0a0a0e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='10' fill='none' stroke='%237c8cff' stroke-width='3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0e; --ink:#f4f4f7; --mut:#8b8b99; --faint:#4d4d59;
  --accent:#7c8cff; --line:rgba(255,255,255,.09);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100svh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.6;
}
a{color:inherit;text-decoration:none}

.aura{
  position:fixed;top:44%;left:50%;width:min(1000px,150vw);height:min(1000px,150vw);
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(124,140,255,.13),rgba(124,140,255,.04) 42%,transparent 68%);
  animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.85}}

.wrap{max-width:640px;margin:0 auto;padding:0 28px;width:100%}
.shell{position:relative;z-index:1;flex:1;display:flex;flex-direction:column}

nav{padding:26px 0}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:22px;
  max-width:1160px;margin:0 auto;padding:0 28px;width:100%}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.mark{width:15px;height:15px;border:2px solid var(--accent);border-radius:50%}
.back{font-size:14px;color:var(--mut);transition:color .3s}
.back:hover{color:var(--ink)}

main{flex:1;display:flex;align-items:center;padding:40px 0 70px}
.head{text-align:center;margin-bottom:44px}
.eyebrow{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);
  opacity:0;animation:fade .9s var(--ease) both .1s}
h1{font-size:clamp(36px,6.5vw,58px);font-weight:600;letter-spacing:-.04em;line-height:1.04;
  margin-top:18px;opacity:0;animation:up 1s var(--ease) both .22s}
.lede{color:var(--mut);font-size:16px;max-width:40ch;margin:18px auto 0;
  opacity:0;animation:up 1s var(--ease) both .34s}
@keyframes fade{to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

form{opacity:0;animation:up 1s var(--ease) both .46s}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
label{font-size:13px;color:var(--mut)}
input,textarea{
  background:rgba(255,255,255,.03);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;font:inherit;font-size:15.5px;width:100%;
  transition:border-color .3s,background .3s}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:rgba(124,140,255,.06)}
textarea{resize:vertical;min-height:140px}
.hp{position:absolute;left:-9999px}

button{
  width:100%;margin-top:8px;background:transparent;color:var(--ink);
  border:1px solid var(--accent);border-radius:999px;padding:15px 30px;
  font:inherit;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  transition:background .35s var(--ease),box-shadow .35s var(--ease),gap .35s var(--ease)}
button:hover:not(:disabled){background:rgba(124,140,255,.12);
  box-shadow:0 0 34px rgba(124,140,255,.26);gap:18px}
button:disabled{opacity:.5;cursor:not-allowed}
button span{font-size:15px;line-height:1;text-transform:none;letter-spacing:0}

.note{margin-top:14px;font-size:14px;text-align:center;min-height:20px}
.note.ok{color:#6ee7a8}
.note.err{color:#ff8b8b}

.or{margin-top:34px;text-align:center;font-size:14px;color:var(--faint);
  opacity:0;animation:fade 1s var(--ease) both .6s}
.or a{color:var(--accent);transition:opacity .3s}
.or a:hover{opacity:.7}

footer{padding:22px 0 30px;color:var(--faint);font-size:11px;text-align:center}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .eyebrow,h1,.lede,form,.or{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="aura" aria-hidden="true"></div>

<div class="shell">

  <nav>
    <div class="nav-in">
      <a class="brand" href="index.html"><i class="mark"></i>Kheir Studio</a>
      <a class="back" href="index.html">&larr; Back</a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <div class="head">
        <p class="eyebrow">Contact</p>
        <h1>Let's talk.</h1>
        <p class="lede">
          Tell us what you are building, or what you need help with.
        </p>
      </div>

      <!-- Replace FORM_ENDPOINT. Until then this falls back to the mail client. -->
      <form id="form" action="https://formspree.io/f/FORM_ENDPOINT" method="POST">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <!-- Bots fill hidden fields; humans never see this one. -->
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" id="send">Send <span>&rarr;</span></button>
        <p class="note" id="note" role="status" aria-live="polite"></p>
      </form>

      <p class="or">Or email <a href="mailto:hello@kheirstudio.com">hello@kheirstudio.com</a></p>
    </div>
  </main>

  <footer>
    <div class="wrap">&copy; <span id="year">2026</span> Kheir Studio Limited</div>
  </footer>

</div>

<script>
(function () {
  document.getElementById('year').textContent = new Date().getFullYear();

  var form = document.getElementById('form');
  var note = document.getElementById('note');
  var send = document.getElementById('send');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // Endpoint not configured yet: hand off to the mail client rather than
    // posting into the void.
    if (form.action.indexOf('FORM_ENDPOINT') !== -1) {
      var subject = encodeURIComponent('Enquiry from ' + (form.name.value || 'the website'));
      var body = encodeURIComponent(
        form.message.value + '\n\n' + form.name.value + ' (' + form.email.value + ')');
      window.location.href = 'mailto:hello@kheirstudio.com?subject=' + subject + '&body=' + body;
      return;
    }

    send.disabled = true;
    note.className = 'note';
    note.textContent = 'Sending…';

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { Accept: 'application/json' }
    }).then(function (r) {
      if (!r.ok) throw new Error('bad response');
      form.reset();
      note.className = 'note ok';
      note.textContent = 'Thanks. We will be in touch.';
    }).catch(function () {
      note.className = 'note err';
      note.textContent = 'That did not send. Please email hello@kheirstudio.com instead.';
    }).finally(function () { send.disabled = false; });
  });
})();
</script>
</body>
</html>
